<html>
<head>
    <title> Clock using js</title>
    <link rel="stylesheet" href="clock.css"> 
</head>
<body>
   <div class="top">

    <p>LOCAL TIME</p>

   </div>
   <div class="clock">
    <p id="today">TODAY</p>
    <p id="day"></p>
    <div class="time">
    <section  class="box" id="hours">00
    </section>
    <section  class="box" id="minutes">00
    </section>
    <section  class="box" id="seconds">00
    </section>
    </div>
    <div class="bottom">
        <div id="text">
        <p>ASIA / KATHMANDU</p>
        </div>
        <div id="system">

        <button id="24">24 hrs</button>
        <button id="12">12 hrs</button>
        </div>
    </div>


    
   </div>

</body>
<script src="clock.js"></script>

</html>
